<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Models | Tech Feed</title>
	<meta name="description" content="The latest model released by each AI lab, updated every hour.">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk&family=Instrument+Sans&display=swap">
	<link rel="stylesheet" href="../assets/landing.css">
	<link rel="stylesheet" href="../assets/section.css">
</head>
<body>
	<canvas class="field" data-shader="field-culture" data-bands="0" aria-hidden="true"></canvas>
	<div class="veil" aria-hidden="true"></div>

	<main class="ledger">
		<header>
			<h1>Models</h1>
			<p class="meta"><span class="updated" data-index="index.json"></span><span class="following pending">Following <button type="button" class="follow-trigger" aria-expanded="false" aria-controls="labs"></button></span><span>Something missing? Report it <a href="https://github.com/christiansassi/tech-feed/issues/new?template=missing-model.yml" target="_blank" rel="noopener">here</a></span></p>
		</header>

		<div class="months"></div>
	</main>

	<div class="follow-layer" id="labs" role="dialog" aria-modal="true" aria-labelledby="labs-title" tabindex="-1">
		<div class="inner">
			<h2 id="labs-title">Labs</h2>
			<p class="note">Scrapers for the other labs are available on <a href="https://github.com/christiansassi/tech-feed/tree/main/models/labs" target="_blank" rel="noopener">GitHub</a>.</p>
			<div class="chips"></div>
		</div>
	</div>

	<script src="../assets/field.js"></script>
	<script src="../assets/landing.js"></script>
	<script src="../assets/section.js"></script>
	<script src="../assets/models.js"></script>
</body>
</html>
