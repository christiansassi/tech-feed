<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>News | Tech Feed</title>
	<meta name="description" content="Stay close to what's next.">
	<!-- Link previews (WhatsApp, Telegram, Slack, X): one image for every page, made from the landing background. -->
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="Tech Feed">
	<meta property="og:title" content="News | Tech Feed">
	<meta property="og:description" content="Stay close to what's next.">
	<meta property="og:url" content="https://christiansassi.github.io/tech-feed/news/">
	<meta property="og:image" content="https://christiansassi.github.io/tech-feed/assets/og.jpg">
	<meta property="og:image:type" content="image/jpeg">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="630">
	<meta property="og:image:alt" content="Tech Feed, over glowing blobs on a dark background">
	<meta name="twitter:card" content="summary_large_image">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&family=Instrument+Sans&display=swap">
	<link rel="stylesheet" href="../assets/landing.css">
	<link rel="stylesheet" href="../assets/section.css">
</head>
<body>
	<canvas class="field" data-shader="field-culture" data-bands="0" aria-hidden="true"></canvas>
	<div class="veil" aria-hidden="true"></div>
	<img class="loader" src="../assets/loader.webp" alt="" aria-hidden="true" fetchpriority="low">

	<a class="home-link" href="../"><svg viewBox="0 0 7 12" aria-hidden="true"><path d="M6 1 1 6l5 5"/></svg>Tech Feed</a>

	<main class="ledger wide">
		<header>
			<h1>News</h1>
			<p class="meta"><span class="updated" data-index="index.json"></span><span class="following pending">Following <button type="button" class="follow-trigger" aria-expanded="false" aria-controls="sources"></button></span><span>Something missing? Report it <a href="https://github.com/christiansassi/tech-feed/issues/new?template=missing-news.yml" target="_blank" rel="noopener">here</a></span></p>
		</header>

		<div class="news-filter" role="group" aria-label="Show" hidden><button type="button" data-filter="all" aria-pressed="true">All</button><button type="button" data-filter="hot" aria-pressed="false">Hot</button></div>

		<div class="cards"></div>

		<div class="empty" hidden><span class="empty-label">Clear skies</span><p class="empty-text">Good news, bad news, or a zero-day. None of it has landed yet.</p></div>
	</main>

	<div class="follow-layer" id="sources" role="dialog" aria-modal="true" aria-labelledby="sources-title" tabindex="-1">
		<div class="inner">
			<h2 id="sources-title">Sources</h2>
			<p class="note">Something missing? Report it <a href="https://github.com/christiansassi/tech-feed/issues/new?template=missing-news.yml" target="_blank" rel="noopener">here</a></p>
			<div class="chips"></div>
		</div>
	</div>

	<script src="../assets/field.js"></script>
	<script src="../assets/landing.js"></script>
	<script src="../assets/section.js"></script>
	<script src="../assets/cover-styles.js"></script>
	<script src="../assets/covers.js"></script>
	<script src="../assets/news.js"></script>
</body>
</html>
