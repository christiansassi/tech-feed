<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Conferences | Tech Feed</title>
	<meta name="description" content="Upcoming security conferences in Europe, with dates, place and ticket availability.">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk&family=Instrument+Sans&display=swap">
	<link rel="stylesheet" href="../assets/landing.css">
	<link rel="stylesheet" href="../assets/section.css">
</head>
<body>
	<canvas class="field" data-shader="field-culture" data-bands="0" aria-hidden="true"></canvas>
	<div class="veil" aria-hidden="true"></div>

	<a class="home-link" href="../"><svg viewBox="0 0 7 12" aria-hidden="true"><path d="M6 1 1 6l5 5"/></svg>Tech Feed</a>

	<main class="ledger">
		<header>
			<h1>Conferences</h1>
			<p class="meta"><span class="updated" data-index="index.json"></span><span class="following pending">Following <button type="button" class="follow-trigger" aria-expanded="false" aria-controls="following"></button></span><span>Something missing? Report it <a href="https://github.com/christiansassi/tech-feed/issues/new?template=missing-conference.yml" target="_blank" rel="noopener">here</a></span></p>
		</header>

		<div class="months events">
			<div class="empty" hidden><span class="empty-label">On the horizon</span><p class="empty-text">Stages are being built and speakers lined up. Every trip will be worth it.</p></div>
		</div>
	</main>

	<div class="follow-layer" id="following" role="dialog" aria-modal="true" aria-labelledby="following-title" tabindex="-1">
		<div class="inner">
			<h2 id="following-title">Following</h2>
			<p class="note">Something missing? Report it <a href="https://github.com/christiansassi/tech-feed/issues/new?template=missing-conference.yml" target="_blank" rel="noopener">here</a></p>
			<div class="chips"></div>
		</div>
	</div>

	<script src="../assets/field.js"></script>
	<script src="../assets/landing.js"></script>
	<script src="../assets/section.js"></script>
	<script src="../assets/conferences.js"></script>
</body>
</html>
