# Build the model-release JSON files and the raw conference pages every hour and
# publish them on GitHub Pages, together with the landing page, the section pages and
# the 404 redirect from site/, and the latest models and conferences that the
# Raspberry updater keeps on the site-data branch.
# The updater starts this workflow with workflow_dispatch after each push to site-data.
# YAML does not allow tab indentation, so this file is the one exception to the tab rule.

name: models

on:
  schedule:
    # Minute 45: the raw files are fresh when the Raspberry updater reads them at minute 0,
    # and GitHub delays or drops scheduled runs at the start of the hour.
    - cron: "45 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "models/**"
      - "conferences/**"
      - "site/**"
      - "requirements.txt"
      - ".github/workflows/models.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build models
        run: python -m models.build --out _site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build conferences
        run: python -m conferences.build --out _site

      - name: Add landing page, section pages and 404 redirect
        run: |
          cp -r site/. _site/
          # Version the asset links with the commit, so browsers fetch the new files after a deploy instead of a cached copy.
          find _site -name "*.html" -exec sed -i "s#\(assets/[a-z]*\.\(js\|css\)\)\"#\1?v=${GITHUB_SHA::7}\"#g" {} +

      - name: Add latest models and conferences from the site-data branch
        run: |
          if git ls-remote --exit-code --heads origin site-data; then
            git fetch --depth 1 origin site-data
            git archive FETCH_HEAD | tar -x -C _site
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
