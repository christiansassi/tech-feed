# Issue form opened by the "Report it here" link on the Models page.
# YAML does not allow tab indentation, so this file uses spaces.
name: Missing lab
description: Suggest a lab whose model releases the Models page should follow.
title: "[Models] "
labels: ["models"]
body:
  - type: input
    id: lab
    attributes:
      label: Lab
      description: The name of the lab, such as OpenAI or Qwen.
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Release page
      description: The page or feed where the lab announces its models, such as a news page, a blog or a Hugging Face organization.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything else, such as other pages where the lab publishes its releases.
