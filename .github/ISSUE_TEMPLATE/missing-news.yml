# Issue form opened by the "Report it here" link on the News page.
# YAML does not allow tab indentation, so this file uses spaces.
name: Missing source
description: Suggest a news source that the News page should follow. Single stories are not added by hand.
title: "[News] "
labels: ["news"]
body:
  - type: input
    id: source
    attributes:
      label: Source
      description: The name of the site or publication.
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link
      description: The address of the site, or of its RSS or Atom feed if it has one.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything else, such as the topics the source covers.
